# The following line helps maintain current documentation at http://docs.pivotal.io.
# code_snippet reference-pipeline start yaml

# Groups start yaml
groups:
- jobs:
    - install-opsman
    - delete-installation
    - test-platform-automation
    - export-installation
    - apply-product-changes
    - hello-world-job
    - download-upload-and-stage-example-product
    - configure-example-product
    - configure-example-product-foo
    - configure-example-product-bar
  name: reference-pipeline
- jobs:
    - create-root-ca
    - apply-new-ca
    - activate-new-ca-and-regenerate-certs
    - apply-certificates
    - cleanup-ca-certificate-authorities
  name: certificate-rotation
# Groups end yaml

# code_snippet reference-resources-s3 start yaml
resource_types:
- name: s3-with-arn
  type: docker-image
  source:
    repository: ((concourse-team/dev_image_registry.url))/concourse/s3-resource
    tag: 1.2.1-ubuntu
    username: ((concourse-team/dev_image_registry.username))
    password: ((concourse-team/dev_image_registry.password))

- name: pivnet
  type: registry-image
  source:
    repository: ((concourse-team/dev_image_registry.url))/pivotalcf/pivnet-resource
    tag: latest-final
    username: ((concourse-team/dev_image_registry.username))
    password: ((concourse-team/dev_image_registry.password))

resources:
- name: platform-automation-tasks
  type: s3-with-arn
  source:
    access_key_id: ((platform-automation/main/s3_with_role.access_key_id))
    secret_access_key: ((platform-automation/main/s3_with_role.secret_access_key))
    aws_role_arn: ((platform-automation/main/s3_with_role.role_arn))
    bucket: ((platform-automation/main/s3_with_role.buckets.release_candidate))
    regexp: platform-automation-tasks-(.*).zip
    region_name: ((platform-automation/main/s3_with_role.region_name))

- name: platform-automation-image
  type: registry-image
  source:
    repository: ((concourse-team/dev_image_registry.url))/internalpcfplatformautomation/platform-automation
    tag: testing
    username: ((concourse-team/dev_image_registry.username))
    password: ((concourse-team/dev_image_registry.password))

# code_snippet export-installation-resource-usage start yaml
- name: installation
  type: s3-with-arn
  source:
    access_key_id: ((platform-automation/main/s3_with_role.access_key_id))
    secret_access_key: ((platform-automation/main/s3_with_role.secret_access_key))
    aws_role_arn: ((platform-automation/main/s3_with_role.role_arn))
    region_name: ((platform-automation/main.s3_region_name))
    bucket: ((platform-automation/main/reference-pipeline.s3_installation_bucket))
    regexp: ((foundation))-installation-(.*).zip
# code_snippet export-installation-resource-usage end

# code_snippet resources-configurations start yaml
# VM state and foundation configuration
- name: state
  type: s3-with-arn
  source:
    access_key_id: ((platform-automation/main/s3_with_role.access_key_id))
    secret_access_key: ((platform-automation/main/s3_with_role.secret_access_key))
    aws_role_arn: ((platform-automation/main/s3_with_role.role_arn))
    bucket: ((platform-automation/main/reference-pipeline.s3_foundation_state_bucket))
    region_name: ((platform-automation/main.s3_region_name))
    versioned_file: state-((foundation)).yml
    initial_content_text: '{}'
    initial_version: 'empty-start'

# configurations
- name: configuration
  type: git
  source:
    private_key: ((platform-automation/main/docs-ref-pipeline-repo-key.private_key))
    uri: ((platform-automation/main.docs-ref-pipeline-repo-uri))
    branch: updateVars-1

- name: foundation-secrets
  type: git
  source:
    private_key: ((platform-automation/main/platform_automation_deployments_ghe_deploy_key.private_key))
    uri: ((platform-automation/main.platform_automation_deployments_ghe_uri))
    branch: fixVars
# code_snippet resources-configurations end yaml

# code_snippet resources-triggers start yaml
# triggers used to have jobs do something in a timely manner
- name: one-time-trigger
  type: time
  source:
    interval: 999999h

- name: daily-trigger
  type: time
  source:
    interval: 24h
# code_snippet resources-triggers end yaml

# code_snippet prepare-tasks-with-secrets-usage start yaml
# This task is used in multiple jobs
# The yaml anchor "*prepare-tasks-with-secrets" is used in its place
prepare-tasks-with-secrets: &prepare-tasks-with-secrets
  image: platform-automation-image
  file: platform-automation-tasks/tasks/prepare-tasks-with-secrets.yml
  input_mapping:
    tasks: platform-automation-tasks
    config: configuration
    vars: foundation-secrets
  params:
    CONFIG_PATHS: config/foundations/((foundation))/config
    VARS_PATHS: vars/reference-epc/((foundation))/secrets config/foundations/((foundation))/vars
  output_mapping:
    tasks: platform-automation-tasks
  tags: [reference-pipeline-worker]
# code_snippet prepare-tasks-with-secrets-usage end yaml
# code_snippet prepare-image-usage start yaml
prepare-image: &prepare-image
  image: platform-automation-image
  file: platform-automation-tasks/tasks/prepare-image.yml
  params:
    CA_CERTS: ((platform-automation/main/reference-pipeline/opsman-ssl.ca))
# code_snippet prepare-image-usage end yaml
# code_snippet reference-jobs start yaml
jobs:
- name: test-platform-automation
  serial: true
  plan:
    - in_parallel:
      - get: platform-automation-image
        tags: [reference-pipeline-worker]
      - get: platform-automation-tasks
        params:
          unpack: true
        tags: [reference-pipeline-worker]
      - get: configuration
        tags: [reference-pipeline-worker]
    # code_snippet test-interpolate-usage start yaml
    - task: test-interpolate
      image: platform-automation-image
      file: platform-automation-tasks/tasks/test-interpolate.yml
      params:
        CONFIG_FILE: foundations/((foundation))/config/download-tas.yml
        SKIP_MISSING: true
      input_mapping:
        config: configuration
      tags: [reference-pipeline-worker]
    # code_snippet test-interpolate-usage end
    # code_snippet test-usage start yaml
    - task: test
      file: platform-automation-tasks/tasks/test.yml
      image: platform-automation-image
      tags: [reference-pipeline-worker]
  # code_snippet test-usage end

- name: install-opsman
  serial: true
  serial_groups: [ install ]
  plan:
  - in_parallel:
    - get: platform-automation-image
      tags: [reference-pipeline-worker]
    - get: one-time-trigger
      tags: [reference-pipeline-worker]
      trigger: true
    - get: platform-automation-tasks
      tags: [reference-pipeline-worker]
      params:
        unpack: true
    - get: configuration
      tags: [reference-pipeline-worker]
    - get: state
      tags: [reference-pipeline-worker]
    - get: foundation-secrets
      tags: [reference-pipeline-worker]
  - task: prepare-tasks-with-secrets
    <<: *prepare-tasks-with-secrets
  - task: prepare-image
    tags: [reference-pipeline-worker]
    <<: *prepare-image
  - task: download-opsman-image
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    config:
      platform: linux
      params:
        USERNAME: ((concourse-team/dev_image_registry.username))
        PASSWORD: ((concourse-team/dev_image_registry.password))
      outputs:
        - name: opsman-image
      run:
        path: sh
        args:
          - -c
          - |
            curl -L -u "${USERNAME}:${PASSWORD}" \
              -o opsman-image/ops-manager.ova \
              https://usw1.packages.broadcom.com/artifactory/tas-bosh-generic-prod-local/ops-manager-dev-builds/pivotal-ops-manager-3.3.0-build.198-20260328t192409-cbddbdb5e8.ova
  # code_snippet create-vm-usage start yaml
  - task: create-vm
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    file: platform-automation-tasks/tasks/create-vm.yml
    input_mapping:
      image: opsman-image
      config: configuration
      vars: foundation-secrets
    params:
      OPSMAN_CONFIG_FILE: foundations/((foundation))/config/opsman.yml
      STATE_FILE: state-((foundation)).yml
      VARS_FILES: vars/reference-epc/((foundation))/secrets/opsman.yml
    ensure: &put-state
      do:
      - put: state
        tags: [reference-pipeline-worker]
        params:
          file: generated-state/state-((foundation)).yml
  # code_snippet create-vm-usage end
  - task: wait-for-opsman
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    config:
      platform: linux
      run:
        path: sleep
        args: ["300"]
  # code_snippet configure-authentication-usage start yaml
  - task: configure-authentication
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    file: platform-automation-tasks/tasks/configure-authentication.yml
    attempts: 10
    input_mapping:
      env: foundation-secrets
      config: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      AUTH_CONFIG_FILE: reference-epc/((foundation))/secrets/auth.yml
  # code_snippet configure-authentication-usage end
  # code_snippet configure-opsman-usage start yaml
  - task: configure-opsman
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    file: platform-automation-tasks/tasks/configure-opsman.yml
    input_mapping:
      env: foundation-secrets
      config: configuration
      vars: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      OPSMAN_CONFIG_FILE: foundations/((foundation))/config/opsman.yml
      VARS_FILES: vars/reference-epc/((foundation))/secrets/opsman.yml
  # code_snippet configure-opsman-usage end
  # code_snippet configure-director-usage start yaml
  - task: configure-director
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    file: platform-automation-tasks/tasks/configure-director.yml
    input_mapping:
      config: configuration
      env: foundation-secrets
      vars: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      DIRECTOR_CONFIG_FILE: foundations/((foundation))/config/director.yml
      VARS_FILES: vars/reference-epc/((foundation))/secrets/director.yml
  # code_snippet configure-director-usage end
  # code_snippet apply-director-changes-usage start yaml
  - task: apply-director-changes
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    attempts: 3
    file: platform-automation-tasks/tasks/apply-director-changes.yml
    input_mapping:
      env: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
  # code_snippet apply-director-changes-usage end
  - task: export-installation
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    file: platform-automation-tasks/tasks/export-installation.yml
    input_mapping:
      env: foundation-secrets
    params:
      INSTALLATION_FILE: ((foundation))-installation-$timestamp.zip
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
  - put: installation
    tags: [reference-pipeline-worker]
    params:
      file: installation/((foundation))-installation*.zip

- name: export-installation
  serial_groups: [ install ]
  serial: true
  plan:
  - in_parallel:
    - get: state
      tags: [reference-pipeline-worker]
      passed: [ install-opsman ]
    - get: daily-trigger
      tags: [reference-pipeline-worker]
      trigger: true
    - get: platform-automation-image
      tags: [reference-pipeline-worker]
    - get: platform-automation-tasks
      tags: [reference-pipeline-worker]
      params:
        unpack: true
    - get: configuration
      tags: [reference-pipeline-worker]
    - get: foundation-secrets
      tags: [reference-pipeline-worker]
  - task: prepare-tasks-with-secrets
    <<: *prepare-tasks-with-secrets
  - task: prepare-image
    tags: [reference-pipeline-worker]
    <<: *prepare-image
  # code_snippet revert-staged-changes-usage start yaml
  - task: revert-staged-changes
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    file: platform-automation-tasks/tasks/revert-staged-changes.yml
    input_mapping:
      env: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
  # code_snippet revert-staged-changes-usage end
  # code_snippet export-installation-usage start yaml
  - task: export-installation
    tags: [reference-pipeline-worker]
    image: platform-automation-image
    file: platform-automation-tasks/tasks/export-installation.yml
    input_mapping:
      env: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      INSTALLATION_FILE: ((foundation))-installation-$timestamp.zip
  # code_snippet export-installation-usage end
  - put: installation
    tags: [reference-pipeline-worker]
    params:
      file: installation/((foundation))-installation*.zip

- name: download-upload-and-stage-example-product
  serial: true
  serial_groups: [ products ]
  plan:
    - in_parallel:
      - get: platform-automation-image
        trigger: true
        passed: [ install-opsman ]
        tags: [reference-pipeline-worker]
      - get: platform-automation-tasks
        params:
          unpack: true
        tags: [reference-pipeline-worker]
      - get: configuration
        tags: [reference-pipeline-worker]
      - get: foundation-secrets
        tags: [reference-pipeline-worker]
    - task: prepare-tasks-with-secrets
      <<: *prepare-tasks-with-secrets
    - task: download-example-product
      image: platform-automation-image
      tags: [reference-pipeline-worker]
      config:
        platform: linux
        params:
          USERNAME: ((concourse-team/dev_image_registry.username))
          PASSWORD: ((concourse-team/dev_image_registry.password))
        outputs:
          - name: example-product
        run:
          path: sh
          args:
            - -c
            - |
              curl -L -u "${USERNAME}:${PASSWORD}" \
                -o example-product/example-product.pivotal \
                https://usw1.packages.broadcom.com/artifactory/tas-operability-generic-dev-local/test/example-product-1.0-build.0.pivotal
    - task: upload-and-stage-example-product
      tags: [reference-pipeline-worker]
      image: platform-automation-image
      file: platform-automation-tasks/tasks/upload-and-stage-product.yml
      input_mapping:
        product: example-product
        env: foundation-secrets
      params:
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
    # code_snippet replicate-uploaded-product-usage start yaml
    - task: replicate-uploaded-example-product
      tags: [reference-pipeline-worker]
      image: platform-automation-image
      file: platform-automation-tasks/tasks/replicate-uploaded-product.yml
      input_mapping:
        product: example-product
        env: foundation-secrets
      params:
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
        REPLICA_SUFFIX: foo
    - task: replicate-uploaded-example-product-2
      tags: [reference-pipeline-worker]
      image: platform-automation-image
      file: platform-automation-tasks/tasks/replicate-uploaded-product.yml
      input_mapping:
        product: example-product
        env: foundation-secrets
      params:
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
        REPLICA_SUFFIX: bar
    # code_snippet replicate-uploaded-product-usage end

- name: configure-example-product
  serial: true
  serial_groups: [ install ]
  plan:
    - in_parallel:
      - get: platform-automation-image
        passed:
          - download-upload-and-stage-example-product
        trigger: true
        tags: [reference-pipeline-worker]
      - get: platform-automation-tasks
        params:
          unpack: true
        tags: [reference-pipeline-worker]
      - get: configuration
        tags: [reference-pipeline-worker]
      - get: foundation-secrets
        tags: [reference-pipeline-worker]
    - task: prepare-tasks-with-secrets
      <<: *prepare-tasks-with-secrets
    - task: configure-example-product
      image: platform-automation-image
      file: platform-automation-tasks/tasks/configure-product.yml
      input_mapping:
        config: configuration
        env: foundation-secrets
      params:
        CONFIG_FILE: foundations/((foundation))/config/example-product.yml
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      tags: [reference-pipeline-worker]

- name: configure-example-product-foo
  serial: true
  serial_groups: [ install ]
  plan:
    - in_parallel:
      - get: platform-automation-image
        passed:
          - download-upload-and-stage-example-product
        trigger: true
        tags: [reference-pipeline-worker]
      - get: platform-automation-tasks
        params:
          unpack: true
        tags: [reference-pipeline-worker]
      - get: configuration
        tags: [reference-pipeline-worker]
      - get: foundation-secrets
        tags: [reference-pipeline-worker]
    - task: prepare-tasks-with-secrets
      <<: *prepare-tasks-with-secrets
    - task: configure-example-product-foo
      image: platform-automation-image
      file: platform-automation-tasks/tasks/configure-product.yml
      input_mapping:
        config: configuration
        env: foundation-secrets
      params:
        CONFIG_FILE: foundations/((foundation))/config/example-product-foo.yml
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      tags: [reference-pipeline-worker]

- name: configure-example-product-bar
  serial: true
  serial_groups: [ install ]
  plan:
    - in_parallel:
      - get: platform-automation-image
        passed:
          - download-upload-and-stage-example-product
        trigger: true
        tags: [reference-pipeline-worker]
      - get: platform-automation-tasks
        params:
          unpack: true
        tags: [reference-pipeline-worker]
      - get: configuration
        tags: [reference-pipeline-worker]
      - get: foundation-secrets
        tags: [reference-pipeline-worker]
    - task: prepare-tasks-with-secrets
      <<: *prepare-tasks-with-secrets
    - task: configure-example-product-bar
      image: platform-automation-image
      file: platform-automation-tasks/tasks/configure-product.yml
      input_mapping:
        config: configuration
        env: foundation-secrets
      params:
        CONFIG_FILE: foundations/((foundation))/config/example-product-bar.yml
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      tags: [reference-pipeline-worker]

- name: apply-product-changes
  serial: true
  serial_groups: [ install ]
  plan:
  - in_parallel:
    - get: platform-automation-image
      tags: [reference-pipeline-worker]
    - get: platform-automation-tasks
      params:
        unpack: true
      tags: [reference-pipeline-worker]
    - get: configuration
      tags: [reference-pipeline-worker]
    - get: foundation-secrets
      tags: [reference-pipeline-worker]
  - task: prepare-tasks-with-secrets
    <<: *prepare-tasks-with-secrets
  - task: prepare-image
    <<: *prepare-image
    tags: [reference-pipeline-worker]
  # code_snippet pre-deploy-check-usage start yaml
  - task: pre-deploy-check
    image: platform-automation-image
    file: platform-automation-tasks/tasks/pre-deploy-check.yml
    input_mapping:
      env: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
    tags: [reference-pipeline-worker]
  # code_snippet pre-deploy-check-usage end
  # code_snippet apply-changes-usage start yaml
  - task: apply-product-changes
    attempts: 3
    image: platform-automation-image
    file: platform-automation-tasks/tasks/apply-changes.yml
    input_mapping:
      env: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
    tags: [reference-pipeline-worker]
  # code_snippet apply-changes-usage end
  # code_snippet check-pending-changes-usage start yaml
  - task: check-pending-changes
    image: platform-automation-image
    file: platform-automation-tasks/tasks/check-pending-changes.yml
    input_mapping:
      env: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      ALLOW_PENDING_CHANGES: true
    tags: [reference-pipeline-worker]
  # code_snippet check-pending-changes-usage end
  - task: export-installation
    image: platform-automation-image
    file: platform-automation-tasks/tasks/export-installation.yml
    input_mapping:
      env: foundation-secrets
    params:
      ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      INSTALLATION_FILE: ((foundation))-installation-$timestamp.zip
    tags: [reference-pipeline-worker]
  - put: installation
    params:
      file: installation/((foundation))-installation*.zip
    tags: [reference-pipeline-worker]

# code_snippet send-telemetry-usage end

- name: delete-installation
  serial: true
  serial_groups: [install]
  plan:
    - in_parallel:
      - get: platform-automation-image
        tags: [reference-pipeline-worker]
      - get: platform-automation-tasks
        params:
          unpack: true
        tags: [reference-pipeline-worker]
      - get: configuration
        tags: [reference-pipeline-worker]
      - get: state
        tags: [reference-pipeline-worker]
      - get: foundation-secrets
        tags: [reference-pipeline-worker]
    - task: prepare-tasks-with-secrets
      <<: *prepare-tasks-with-secrets
      tags: [reference-pipeline-worker]
    # code_snippet delete-installation-usage start yaml
    - task: delete-installation
      image: platform-automation-image
      file: platform-automation-tasks/tasks/delete-installation.yml
      input_mapping:
        env: foundation-secrets
      params:
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      tags: [reference-pipeline-worker]
      # code_snippet delete-installation-usage end yaml
    # code_snippet delete-vm-usage start yaml
    - task: delete-vm
      image: platform-automation-image
      file: platform-automation-tasks/tasks/delete-vm.yml
      tags: [reference-pipeline-worker]
      input_mapping:
        config: configuration
        vars: foundation-secrets
      params:
        OPSMAN_CONFIG_FILE: foundations/((foundation))/config/opsman.yml
        STATE_FILE: state-((foundation)).yml
      ensure:
        do:
        - put: state
          params:
            file: generated-state/state-((foundation)).yml
          tags: [reference-pipeline-worker]
    # code_snippet delete-vm-usage end

# code_snippet certificate-rotation start
- name: create-root-ca
  plan:
    - in_parallel:
        - get: platform-automation-image
          tags: [reference-pipeline-worker]
        - get: platform-automation-tasks
          params:
            unpack: true
          tags: [reference-pipeline-worker]
        - get: configuration
          tags: [reference-pipeline-worker]
        - get: foundation-secrets
          tags: [reference-pipeline-worker]
    - task: prepare-tasks-with-secrets
      <<: *prepare-tasks-with-secrets
      tags: [reference-pipeline-worker]
    # code_snippet configure-new-certificate-authority-usage start yaml
    - task: create-root-ca
      image: platform-automation-image
      file: platform-automation-tasks/tasks/configure-new-certificate-authority.yml
      input_mapping:
        env: foundation-secrets
      params:
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      tags: [reference-pipeline-worker]
    # code_snippet configure-new-certificate-authority-usage end

- name: apply-new-ca
  serial: true
  plan:
    - in_parallel:
        - get: platform-automation-image
          passed:
            - create-root-ca
          tags: [reference-pipeline-worker]
        - get: platform-automation-tasks
          params:
            unpack: true
          tags: [reference-pipeline-worker]
        - get: configuration
          tags: [reference-pipeline-worker]
        - get: foundation-secrets
          tags: [reference-pipeline-worker]
    - task: prepare-tasks-with-secrets
      <<: *prepare-tasks-with-secrets
      tags: [reference-pipeline-worker]
    - task: pre-deploy-check
      image: platform-automation-image
      file: platform-automation-tasks/tasks/pre-deploy-check.yml
      input_mapping:
        env: foundation-secrets
      params:
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
      tags: [reference-pipeline-worker]
    - task: apply-product-changes
      attempts: 3
      image: platform-automation-image
      file: platform-automation-tasks/tasks/apply-changes.yml
      input_mapping:
        env: foundation-secrets
      params:
        ENV_FILE: reference-epc/((foundation))/secrets/env.yml
        SELECTIVE_DEPLOY_PRODUCTS: "cf,p-bosh,p-healthwatch2,p-healthwatch2-pas-exporter,pivotal-telemetry-om"
      tags: [reference-pipeline-worker]

