groups:
- jobs:
  - install-opsman
  - expiring-certificates
  - expiring-licenses
  - delete-installation
  - test-platform-automation
  - export-installation
  - upgrade-opsman
  - download-upload-and-stage-healthwatch-pas-exporter
  - download-upload-and-stage-healthwatch
  - download-upload-and-stage-tas
  - download-upload-and-stage-example-licensed-product
  - configure-healthwatch-pas-exporter
  - configure-healthwatch
  - configure-tas
  - configure-example-licensed-product
  - apply-product-changes
  - run-tas-smoketest-errand
  - collect-telemetry
  - stage-configure-apply-telemetry
  name: reference-pipeline
- jobs:
  - create-root-ca
  - apply-new-ca
  - activate-new-ca-and-regenerate-certs
  - apply-certificates
  - cleanup-ca-certificate-authorities
  name: certificate-rotation
jobs:
- name: test-platform-automation
  plan:
  - in_parallel:
      steps:
      - get: platform-automation-image
        params:
          unpack: true
      - get: platform-automation-tasks
        params:
          unpack: true
      - get: configuration
  - file: platform-automation-tasks/tasks/test-interpolate.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
    params:
      CONFIG_FILE: foundations/sandbox/config/download-tas.yml
      SKIP_MISSING: "true"
    task: test-interpolate
  - file: platform-automation-tasks/tasks/test.yml
    image: platform-automation-image
    task: test
  serial: true
- name: install-opsman
  plan:
  - in_parallel:
      steps:
      - get: platform-automation-image
        params:
          unpack: true
      - get: one-time-trigger
        trigger: true
      - get: platform-automation-tasks
        params:
          unpack: true
      - get: configuration
      - get: state
  - file: platform-automation-tasks/tasks/prepare-tasks-with-secrets.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      tasks: platform-automation-tasks
      vars: configuration
    output_mapping:
      tasks: platform-automation-tasks
    params:
      CONFIG_PATHS: config/foundations/config config/foundations/sandbox/config
      VARS_PATHS: vars/foundations/sandbox/vars
    task: prepare-tasks-with-secrets
  - file: platform-automation-tasks/tasks/prepare-image.yml
    image: platform-automation-image
    params:
      CA_CERTS: ((platform-automation/main/reference-pipeline/opsman-ssl.ca))
    task: prepare-image
  - file: platform-automation-tasks/tasks/download-product.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      vars: configuration
    output_mapping:
      downloaded-product: opsman-image
    params:
      CONFIG_FILE: foundations/sandbox/config/download-opsman.yml
      SOURCE: pivnet
      VARS_FILES: vars/foundations/sandbox/vars/versions.yml
    task: download-opsman-image
  - ensure:
      do:
      - params:
          file: generated-state/state-sandbox.yml
        put: state
    file: platform-automation-tasks/tasks/create-vm.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      image: opsman-image
      vars: configuration
    params:
      OPSMAN_CONFIG_FILE: foundations/sandbox/config/opsman.yml
      STATE_FILE: state-sandbox.yml
      VARS_FILES: vars/foundations/sandbox/vars/director.yml
    task: create-vm
  - attempts: 10
    file: platform-automation-tasks/tasks/configure-authentication.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      env: configuration
    params:
      AUTH_CONFIG_FILE: foundations/config/auth.yml
      ENV_FILE: foundations/config/env.yml
    task: configure-authentication
  - file: platform-automation-tasks/tasks/configure-opsman.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      env: configuration
      vars: configuration
    params:
      ENV_FILE: foundations/config/env.yml
      OPSMAN_CONFIG_FILE: foundations/sandbox/config/opsman.yml
      VARS_FILES: vars/foundations/sandbox/vars/director.yml
    task: configure-opsman
  - file: platform-automation-tasks/tasks/configure-director.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      env: configuration
      vars: configuration
    params:
      DIRECTOR_CONFIG_FILE: foundations/sandbox/config/director.yml
      ENV_FILE: foundations/config/env.yml
      VARS_FILES: |
        vars/foundations/sandbox/vars/director.yml
        vars/foundations/sandbox/vars/tas.yml
    task: configure-director
  - attempts: 3
    file: platform-automation-tasks/tasks/apply-director-changes.yml
    image: platform-automation-image
    input_mapping:
      env: configuration
    params:
      ENV_FILE: foundations/config/env.yml
    task: apply-director-changes
  - file: platform-automation-tasks/tasks/export-installation.yml
    image: platform-automation-image
    input_mapping:
      env: configuration
    params:
      ENV_FILE: foundations/config/env.yml
      INSTALLATION_FILE: sandbox-installation-$timestamp.zip
    task: export-installation
  - params:
      file: installation/sandbox-installation*.zip
    put: installation
  serial: true
  serial_groups:
  - install
- name: export-installation
  plan:
  - in_parallel:
      steps:
      - get: state
        passed:
        - install-opsman
      - get: daily-trigger
        trigger: true
      - get: platform-automation-image
        params:
          unpack: true
      - get: platform-automation-tasks
        params:
          unpack: true
      - get: configuration
  - file: platform-automation-tasks/tasks/prepare-tasks-with-secrets.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      tasks: platform-automation-tasks
      vars: configuration
    output_mapping:
      tasks: platform-automation-tasks
    params:
      CONFIG_PATHS: config/foundations/config config/foundations/sandbox/config
      VARS_PATHS: vars/foundations/sandbox/vars
    task: prepare-tasks-with-secrets
  - file: platform-automation-tasks/tasks/prepare-image.yml
    image: platform-automation-image
    params:
      CA_CERTS: ((platform-automation/main/reference-pipeline/opsman-ssl.ca))
    task: prepare-image
  - file: platform-automation-tasks/tasks/revert-staged-changes.yml
    image: platform-automation-image
    input_mapping:
      env: configuration
    params:
      ENV_FILE: foundations/config/env.yml
    task: revert-staged-changes
  - file: platform-automation-tasks/tasks/export-installation.yml
    image: platform-automation-image
    input_mapping:
      env: configuration
    params:
      ENV_FILE: foundations/config/env.yml
      INSTALLATION_FILE: sandbox-installation-$timestamp.zip
    task: export-installation
  - params:
      file: installation/sandbox-installation*.zip
    put: installation
  serial: true
  serial_groups:
  - install
- name: upgrade-opsman
  plan:
  - in_parallel:
      steps:
      - get: platform-automation-image
        params:
          unpack: true
        trigger: true
      - get: platform-automation-tasks
        params:
          unpack: true
      - get: installation
        passed:
        - export-installation
      - get: configuration
      - get: state
      - get: opsman-image-file
  - file: platform-automation-tasks/tasks/prepare-tasks-with-secrets.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      tasks: platform-automation-tasks
      vars: configuration
    output_mapping:
      tasks: platform-automation-tasks
    params:
      CONFIG_PATHS: config/foundations/config config/foundations/sandbox/config
      VARS_PATHS: vars/foundations/sandbox/vars
    task: prepare-tasks-with-secrets
  - file: platform-automation-tasks/tasks/prepare-image.yml
    image: platform-automation-image
    params:
      CA_CERTS: ((platform-automation/main/reference-pipeline/opsman-ssl.ca))
    task: prepare-image
  - ensure:
      do:
      - params:
          file: generated-state/state-sandbox.yml
        put: state
    file: platform-automation-tasks/tasks/upgrade-opsman.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      env: configuration
      image: opsman-image-file
      vars: configuration
    params:
      ENV_FILE: foundations/config/env.yml
      INSTALLATION_FILE: sandbox-installation*.zip
      OPSMAN_CONFIG_FILE: foundations/sandbox/config/opsman.yml
      STATE_FILE: state-sandbox.yml
      VARS_FILES: vars/foundations/sandbox/vars/director.yml
    task: upgrade-opsman
  - file: platform-automation-tasks/tasks/configure-director.yml
    image: platform-automation-image
    input_mapping:
      config: configuration
      env: configuration
      vars: configuration
    params:
      DIRECTOR_CONFIG_FILE: foundations/sandbox/config/director.yml
      ENV_FILE: foundations/config/env.yml
      VARS_FILES: |
        vars/foundations/sandbox/vars/director.yml
        vars/foundations/sandbox/vars/tas.yml
    task: configure-director
  - attempts: 3
    file: platform-automation-tasks/tasks/apply-director-changes.yml
    image: platform-automation-image
    input_mapping:
      env: configuration
    params:
      ENV_FILE: foundations/config/env.yml
    task: apply-director-changes
  - file: platform-automation-tasks/tasks/export-installation.yml
    image: platform-automation-image
    input_mapping:
      env: configuration
    params:
      ENV_FILE: foundations/config/env.yml
      INSTALLATION_FILE: sandbox-installation-$timestamp.zip
    task: export-installation
  - params:
      file: installation/sandbox-installation*.zip
    put: installation
  serial: true
  serial_groups:
  - install
- name: download-upload-and-stage-tas
  plan:
  - in_parallel:
      steps:
      - get: platform-automation-image
        params:
