---
product-name: cf
network-properties:
  network:
    name: deployment
  other_availability_zones:
    - name: ((availability_zones.0))
  singleton_availability_zone:
    name: ((availability_zones.0))
product-properties:
  .cloud_controller.apps_domain:
    value: ((apps_dns_domain))
  .cloud_controller.system_domain:
    value: ((sys_dns_domain))
  .uaa.service_provider_key_credentials:
    value:
      cert_pem: |
        ((uaa_ssl_certificate))
      private_key_pem: |
        ((uaa_ssl_private_key))
  .properties.credhub_internal_provider_keys:
    value:
      - key:
          secret: 1a2b3c4d5e6f7g8h9i0j
        name: Key
        primary: true
  .properties.networking_poe_ssl_certs:
    value:
      - certificate:
          cert_pem: |
            ((networking_ssl_certificate))
          private_key_pem: |
            ((networking_ssl_private_key))
        name: Certificate
  .properties.security_acknowledgement:
    value: X
  .properties.system_blobstore:
    value: internal
  .properties.tcp_routing:
    value: enable
resource-config:
  compute:
    instances: 5
  control:
    nsxt:
      lb:
        server_pools:
          - name: server_pool-tas-ssh
  router:
    nsxt:
      lb:
        server_pools:
          - name: server_pool-tas-web
